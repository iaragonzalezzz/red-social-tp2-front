<router-outlet></router-outlet>

<div
  class="modal-backdrop"
  *ngIf="mostrarModal"
>

  <div class="modal">

    <h2>
      Tu sesión está por vencer
    </h2>

    <p>
      ¿Deseás extender tu sesión?
    </p>

    <div class="botones">

      <button
        class="btn cancelar"
        (click)="cerrarSesion()"
      >
        No
      </button>

      <button
        class="btn confirmar"
        (click)="extenderSesion()"
      >
        Sí, extender
      </button>

    </div>

  </div>

</div>
