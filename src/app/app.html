<router-outlet></router-outlet>

<div
  class="modal-backdrop"
  *ngIf="mostrarModal"
>

  <div class="modal">

    <h2>
      Tu sesión está por vencer
    </h2>

    <p>
      ¿Deseás extender tu sesión por 15 minutos más?
    </p>

    <div class="botones">

      <button
        class="btn cancelar"
        type="button"
        [disabled]="refrescando"
        (click)="cerrarSesion()"
      >
        No, cerrar sesión
      </button>

      <button
        class="btn confirmar"
        type="button"
        [disabled]="refrescando"
        (click)="extenderSesion()"
      >
        {{ refrescando ? 'Extendiendo...' : 'Sí, extender' }}
      </button>

    </div>

  </div>

</div>
