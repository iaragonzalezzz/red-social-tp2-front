<div class="login-page">

  <section class="login-card">

    <div class="brand">
      <img src="favicon.png" alt="LilaSocial" />
      <h1>LilaSocial</h1>
      <p>Conectá, compartí y descubrí publicaciones.</p>
    </div>

    <form>

      <input
        type="text"
        placeholder="Usuario o correo"
        [(ngModel)]="usuarioOCorreo"
        name="usuarioOCorreo"
      />

      <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        name="password"
      />

      <button type="button" (click)="iniciarSesion()">
        Iniciar sesión
      </button>

    </form>

    <p class="registro">
      ¿No tenés cuenta?
      <a routerLink="/registro">Registrate</a>
    </p>

  </section>

</div>
