<div class="contenedor-login">

  <div class="card login-card">

    <h1>LilaSocial</h1>

    <p class="subtitulo">
      Iniciá sesión para continuar
    </p>

    <form
      #formLogin="ngForm"
      (ngSubmit)="iniciarSesion()"
    >

      <input
        type="text"
        placeholder="Usuario o correo"
        [(ngModel)]="usuarioOCorreo"
        name="usuarioOCorreo"
        required
      />

      <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        name="password"
        required
      />

      <p
        class="error"
        *ngIf="
          formLogin.submitted &&
          (!usuarioOCorreo || !password)
        "
      >
        Completá usuario/correo y contraseña.
      </p>

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <p
      class="error"
      *ngIf="mensajeError"
    >
      {{ mensajeError }}
    </p>

    <p class="registro-link">
      ¿No tenés cuenta?

      <a routerLink="/registro">
        Registrate
      </a>
    </p>

  </div>

</div>
