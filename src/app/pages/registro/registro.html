<div class="contenedor-registro">

  <div class="card registro-card">

    <div class="brand">
      <img src="favicon.png" alt="LilaSocial" />
      <h1>LilaSocial</h1>
      <p>Creá tu cuenta y empezá a compartir</p>
    </div>

    <form
      #formRegistro="ngForm"
      (ngSubmit)="registrarse()"
    >

      <div class="form-grid">

        <input
          type="text"
          placeholder="Nombre"
          [(ngModel)]="nombre"
          name="nombre"
          required
        />

        <input
          type="text"
          placeholder="Apellido"
          [(ngModel)]="apellido"
          name="apellido"
          required
        />

      </div>

      <input
        type="email"
        placeholder="Correo"
        [(ngModel)]="correo"
        name="correo"
        required
      />

      <input
        type="text"
        placeholder="Nombre de usuario"
        [(ngModel)]="nombreUsuario"
        name="nombreUsuario"
        required
      />

      <div class="form-grid">

        <input
          type="password"
          placeholder="Contraseña"
          [(ngModel)]="password"
          name="password"
          required
        />

        <input
          type="password"
          placeholder="Repetir contraseña"
          [(ngModel)]="repetirPassword"
          name="repetirPassword"
          required
        />

      </div>

      <label class="fecha-label">
        <span>Fecha de nacimiento</span>
        <input
          type="date"
          [(ngModel)]="fechaNacimiento"
          name="fechaNacimiento"
        />
      </label>

      <textarea
        placeholder="Descripción breve"
        [(ngModel)]="descripcion"
        name="descripcion"
      ></textarea>

      <label class="file-box">

        <span>Subir foto de perfil</span>

        <small *ngIf="!nombreFotoPerfil">
          Ningún archivo seleccionado
        </small>

        <small *ngIf="nombreFotoPerfil">
          {{ nombreFotoPerfil }}
        </small>

        <input
          type="file"
          accept="image/*"
          (change)="seleccionarImagen($event)"
        />

      </label>

      <p
        class="error"
        *ngIf="
          formRegistro.submitted &&
          (
            !nombre ||
            !apellido ||
            !correo ||
            !nombreUsuario ||
            !password ||
            !repetirPassword
          )
        "
      >
        Completá todos los campos obligatorios.
      </p>

      <p
        class="error"
        *ngIf="passwordInvalida()"
      >
        La contraseña debe tener 8 caracteres, una mayúscula y un número.
      </p>

      <p
        class="error"
        *ngIf="
          password &&
          repetirPassword &&
          password !== repetirPassword
        "
      >
        Las contraseñas no coinciden.
      </p>

      <button type="submit">
        Registrarme
      </button>

    </form>

    <p
      class="error"
      *ngIf="mensajeError"
    >
      {{ mensajeError }}
    </p>

    <p class="login-link">
      ¿Ya tenés cuenta?
      <a routerLink="/login">
        Iniciá sesión
      </a>
    </p>

  </div>

</div>
